<style>
body{margin:0}
a{color:#4BF2C5}a:hover{color:#8F7BFF}

.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.ev.v::before{background:#4BF2C5}.ev.p::before{background:#74C7FF}.ev.z::before{background:#FFC566}
.ev .t{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600}
.ev b{font-size:13.5px;line-height:1.25}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:#0F0E1D;border:1px solid rgba(190,180,255,.13)}
.seg button{height:36px;padding:0 14px;border:0;border-radius:9px;background:transparent;font-weight:700;font-size:14px;color:#BDB9DC}
.seg button.on{background:#17162B;color:#F3F1FF}
