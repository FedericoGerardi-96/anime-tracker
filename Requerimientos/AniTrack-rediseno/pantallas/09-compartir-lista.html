<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compartir lista · AniTrack</title>
<link rel="stylesheet" href="anitrack.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#4BF2C5}a:hover{color:#8F7BFF}
.pv{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px;border-radius:12px;border:1px solid rgba(190,180,255,.13);background:transparent;text-align:left}
.pv.on{border-color:rgba(75,242,197,.5);background:rgba(75,242,197,.06)}
.rd{width:20px;height:20px;border-radius:50%;border:2px solid #9894BD;display:grid;place-items:center;flex:none;margin-top:2px}
.pv.on .rd{border-color:#4BF2C5}
.pv.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:#4BF2C5}
</style>

</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div class="at" style="padding-bottom: 80px">
<header class="nav"><div class="wrap nav-in">
<a href="#" class="logo" aria-label="AniTrack, inicio"><svg width="34" height="34" viewBox="-3 -3 42 42" aria-hidden="true"><defs><linearGradient id="lgN" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4BF2C5"></stop><stop offset="1" stop-color="#8F7BFF"></stop></linearGradient></defs><circle cx="18" cy="18" r="13" fill="none" stroke="rgba(243,241,255,.13)" stroke-width="4"></circle><path d="M18 5 A13 13 0 1 1 5 18" fill="none" stroke="url(#lgN)" stroke-width="4" stroke-linecap="round"></path><path d="M15 12.6 L24 18 L15 23.4 Z" fill="#F3F1FF"></path><path d="M5 11.5 L6.3 16.7 L11.5 18 L6.3 19.3 L5 24.5 L3.7 19.3 L-1.5 18 L3.7 16.7 Z" fill="#FF7AB8"></path></svg><span class="logo-word">Ani<b>Track</b></span></a>
<nav class="links" aria-label="Principal"><a href="#">Inicio</a><a href="#">Anime</a><a href="#">Manga</a><a href="#">Calendario</a><a href="#" class="on">Listas</a><a href="#">Amigos</a></nav>
<a href="#" class="avatar" style="margin-left: auto" aria-label="Tu perfil"><span>RT</span></a>
</div></header>

<main class="wrap" style="display: flex; flex-direction: column; gap: 32px; padding-top: 40px">
<div style="display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-end">
<div style="position: relative; width: 150px; height: 156px; flex: none" aria-hidden="true">
<div class="poster p7" style="position: absolute; width: 92px; left: 0; top: 16px; transform: rotate(-8deg)"></div>
<div class="poster p1" style="position: absolute; width: 92px; left: 58px; top: 16px; transform: rotate(7deg)"></div>
<div class="poster p6" style="position: absolute; width: 100px; left: 25px; top: 0; box-shadow: 0 20px 40px -12px rgba(0,0,0,.8)"></div>
</div>
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<p class="eyebrow">Tu lista · Maratón</p>
<h1 class="display" style="font-size: 42px">Maratón de invierno</h1>
<div class="sm muted" style="display: flex; gap: 16px; flex-wrap: wrap"><span class="mono">7 títulos</span><span class="mono">~41 h</span><span>{{ visLabel }}</span></div>
</div>
<button type="button" class="btn btn-primary" aria-expanded="true"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="6" r="2.5"></circle><circle cx="18" cy="18" r="2.5"></circle><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"></path></svg>Compartir</button>
</div>

<div style="display: flex; gap: 32px; flex-wrap: wrap; align-items: flex-start">
<div class="panel" role="dialog" aria-label="Compartir lista" style="flex: 1 1 460px; max-width: 560px; min-width: 0; padding: 24px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 30px 70px -20px rgba(0,0,0,.8); border-color: rgba(190,180,255,.22)">
<div style="display: flex; justify-content: space-between; align-items: center"><h2 class="h2">Compartir lista</h2><button type="button" class="btn btn-ghost btn-icon btn-sm" aria-label="Cerrar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></button></div>

<div role="radiogroup" aria-label="Quién puede verla" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ vis }}" as="v" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{ v.on }}" class="pv {{ v.cls }}" onClick="{{ v.pick }}"><span class="rd" aria-hidden="true"></span><span style="display: flex; flex-direction: column; gap: 2px"><b class="sm">{{ v.name }}</b><span class="xs faint">{{ v.desc }}</span></span></button>
</sc-for>
</div>

<sc-if value="{{ canShare }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="lnk" class="xs faint mono" style="text-transform: uppercase; letter-spacing: .12em">Link de la lista</label>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<input id="lnk" readonly value="anime-tracker-smoky.vercel.app/l/maraton-de-invierno" style="flex: 1 1 240px; min-width: 0; height: 44px; padding: 0 12px; border-radius: 12px; background: #07070F; border: 1px solid rgba(190,180,255,.22); color: #F3F1FF; font-family: 'JetBrains Mono', monospace; font-size: 13px">
<button type="button" class="btn btn-primary" onClick="{{ copy }}">{{ copyLabel }}</button>
</div>
</div>
<div style="display: flex; align-items: center; gap: 10px" class="sm muted">
<div style="display: flex"><span class="avatar" style="width: 28px; height: 28px"><span style="font-size: 10px">FG</span></span><span class="avatar" style="width: 28px; height: 28px; margin-left: -8px"><span style="font-size: 10px">MA</span></span></div>
<span>La siguen <b style="color: #F3F1FF">Fede</b> y <b style="color: #F3F1FF">Mati</b> · 1 copia</span>
</div>
</sc-if>
<sc-if value="{{ isPrivate }}" hint-placeholder-val="{{ false }}">
<p class="sm muted" style="margin: 0; padding: 14px; border-radius: 12px; background: #07070F; border: 1px dashed rgba(190,180,255,.22)">Mientras sea privada no hay link. Si la volvés privada después de compartirla, el link deja de funcionar y quienes la seguían ya no la ven.</p>
</sc-if>
</div>

<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<p class="eyebrow" style="color: #9894BD">Así se ve al pegarlo en un chat</p>
<div style="max-width: 420px; padding: 8px; border-radius: 16px 16px 4px 16px; background: #1D3B34; align-self: flex-start; display: flex; flex-direction: column; gap: 8px">
<div style="border-radius: 10px; overflow: hidden; background: #0F0E1D">
<div style="height: 168px; display: flex; gap: 8px; align-items: center; justify-content: center; background: radial-gradient(240px 140px at 15% 0%, rgba(143,123,255,.5), transparent 70%), radial-gradient(220px 140px at 100% 0%, rgba(75,242,197,.3), transparent 70%), #07070F">
<div class="poster p7" style="width: 76px; transform: rotate(-6deg)"></div><div class="poster p6" style="width: 84px"></div><div class="poster p1" style="width: 76px; transform: rotate(6deg)"></div>
</div>
<div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
<b class="sm">Maratón de invierno · AniTrack</b>
<span class="xs muted">7 títulos · lista de Rodri</span>
<span class="xs faint mono">anime-tracker-smoky.vercel.app</span>
</div>
</div>
<span class="sm" style="padding: 0 4px">les paso mi maratón para las vacaciones</span>
<span class="xs" style="align-self: flex-end; color: rgba(243,241,255,.6); padding: 0 4px">01:44</span>
</div>
<p class="xs faint" style="margin: 0; max-width: 46ch">La imagen se genera sola con los tres primeros pósters de la lista (metadatos Open Graph). Funciona igual en WhatsApp, Discord y Telegram.</p>
</div>
</div>
</main>
</div>
</template>
<script src="runtime.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { vis: 'link', copied: false }; }
  renderVals() {
    const V = [
      { id: 'private', name: 'Privada', desc: 'Solo vos la ves.' },
      { id: 'link', name: 'Cualquiera con el link', desc: 'No aparece en tu perfil, pero quien tenga el link la puede ver y guardar.' },
      { id: 'public', name: 'Pública en mi perfil', desc: 'Aparece en tu perfil y también se comparte por link.' }
    ];
    const { vis, copied } = this.state;
    const labels = { private: 'Privada', link: 'Compartida por link', public: 'Pública' };
    return {
      vis: V.map(v => ({ ...v, on: vis === v.id, cls: vis === v.id ? 'on' : '', pick: () => this.setState({ vis: v.id, copied: false }) })),
      visLabel: labels[vis],
      canShare: vis !== 'private',
      isPrivate: vis === 'private',
      copyLabel: copied ? 'Copiado' : 'Copiar link',
      copy: () => this.setState({ copied: true })
    };
  }
}

window.__dcBoot(Component, {});
</script>
</body>
</html>
