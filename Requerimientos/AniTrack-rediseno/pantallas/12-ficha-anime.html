<!doctype html>

        <link rel="stylesheet" href="anitrack.css" />

        <link

        <style>
            body {
                margin: 0;
            }
            a {
                color: #4bf2c5;
            }
            a:hover {
                color: #8f7bff;
            }
            .kv {
                display: flex;
                justify-content: space-between;
                gap: 16px;
                padding: 10px 0;
                border-bottom: 1px solid rgba(190, 180, 255, 0.13);
                font-size: 14px;
            }
            .kv span:first-child {
                color: #9894bd;
            }
            .chk {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 9px 10px;
                border-radius: 9px;
                font-size: 14px;
                font-weight: 600;
            }
            .box {
                width: 20px;
                height: 20px;
                border-radius: 6px;
                border: 2px solid rgba(243, 241, 255, 0.5);
                display: grid;
                place-items: center;
                flex: none;
            }
            .box.on {
                background: #4bf2c5;
                border-color: #4bf2c5;
                color: #062a22;
            }
